[package]
name = "licra-client"
version = "0.3.1"
edition = "2021"
[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-global-shortcut", "dep:tauri-plugin-updater", "dep:tauri-plugin-process", "dep:tauri-plugin-dialog"]

[[bin]]
name = "licra-client"
path = "src/main.rs"
required-features = ["desktop"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }
[dependencies]
tauri = { version = "2", features = [], optional = true }
tauri-plugin-global-shortcut = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
base64 = "0.22"
aes-gcm = "0.10"
argon2 = "0.5"
zeroize = "1"
[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows-core = "0.62"
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Memory", "Win32_UI_Shell"] }

[dev-dependencies]
minisign-verify = "0.2"
