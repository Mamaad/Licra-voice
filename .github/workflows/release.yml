name: Signed releases
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go test -race ./... && go build -trimpath -ldflags='-s -w' -o ../bin/licra-server ./cmd/licra-server
        working-directory: server
      - run: ./scripts/download-livekit.sh
      - run: |
          mkdir -p dist/licra
          cp -a bin scripts packaging docs README.md LICENSE dist/licra/
          tar -czf dist/licra-server-linux-x86_64.tar.gz -C dist licra
          cd dist
          sha256sum licra-server-linux-x86_64.tar.gz > checksums-linux.txt
          cd ../bin
          sha256sum licra-server > ../dist/checksums-server.txt
          cd ..
          mkdir -p dist/linux-assets
          cp dist/licra-server-linux-x86_64.tar.gz dist/checksums-linux.txt dist/checksums-server.txt bin/licra-server dist/linux-assets/
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: dist/linux-assets/*
  windows:
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: python scripts/check-versions.py
      - run: npm ci && npm test && npm run tauri -- build --bundles nsis
        working-directory: client
      - name: Verify signature and installer data retention
        run: |
          $setup = (Get-ChildItem client/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1).FullName
          cargo run --manifest-path client/src-tauri/Cargo.toml --no-default-features --example verify_updater -- packaging/updater.pub "${setup}.sig" "$setup"
          ./packaging/windows/smoke-install.ps1
      - run: python scripts/generate-latest.py --version (Get-Content CLIENT_VERSION).Trim() --bundle client/src-tauri/target/release/bundle/nsis --notes RELEASE_NOTES.md --output latest.json
      - run: |
          New-Item -ItemType Directory -Force dist/windows-assets
          Copy-Item client/src-tauri/target/release/bundle/nsis/*.exe dist/windows-assets/
          Copy-Item client/src-tauri/target/release/bundle/nsis/*.sig dist/windows-assets/
          Copy-Item latest.json dist/windows-assets/
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/windows-assets/*
  publish:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --title "Licra $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
