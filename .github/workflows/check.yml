name: Validate
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go test -race ./... && go vet ./... && go build ./cmd/licra-server
        working-directory: server
      - run: go build -o ../bin/licra-server ./cmd/licra-server
        working-directory: server
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: ./scripts/download-livekit.sh
      - run: npm ci && npm --prefix client ci && npx playwright install --with-deps chromium && npm run test:media && npm run test:ui
      - run: bash -n scripts/*.sh
      - run: python3 scripts/generate-protocol.py --check
  client:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci && npm run build && npm test
        working-directory: client
      - run: cargo test --locked --no-default-features --lib
        working-directory: client/src-tauri
      - run: npm run tauri -- build --no-bundle
        working-directory: client
      - uses: actions/upload-artifact@v4
        with:
          name: licra-windows-check
          path: client/src-tauri/target/release/licra-client.exe
